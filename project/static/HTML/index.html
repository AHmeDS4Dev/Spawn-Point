<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/project/static/CSS/headerBar.css">
    <title>Home</title>
</head>
<style>
    @font-face{
    font-family: 'mc';
    src: url('/project/src/fonts/Jersey_10/Jersey10-Regular.ttf');
}
body{
    font-family: mc;
    background: #f8ece1;
}
header{
    position: absolute;
    top: 0; left: 0;
    width: 100vw;
    background: #d1bfa7;
    border-bottom: 0.1px black;
    box-shadow: 0 0 4px rgb(49, 48, 48);
    height: 60px;
    font-family: mc;
}
header > div{
    position: relative;
    height: 100%;
    width: 45%;
    left: 48%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 20px;
    
}
header > div > h4 {
    margin: 10px;
    transition: 0.1s linear;
    gap: 1rem;
}
header > div > h4:hover{
    box-shadow: 0 0 0 5px #bf824f;
    background: #bf824f;
    border-radius: 8px;
    transform: scale(1.01);
    cursor: pointer;

}
header > h2 {
    position: absolute;
    font-size: 30px;
    font-weight: bolder;
    left: 20px;
    top: -15px;
}
header > h3 {
    position: absolute;
    font-size: 18px;
    font-weight: bolder;
    left: 70px;
    top: 16px;
    color: #0d5d5d;
}
.userIcon{
    position: absolute;
    padding: 2px;
    z-index: 222;
    top: 17px;
    right: 25px;
    scale: 1.7;
}
    .home{
        box-shadow: 0 0 0 5px rgb(149, 100, 61);
        background: rgb(149, 100, 61);
        border-radius: 8px;
        transform: scale(1.01);
        cursor: pointer;
    }
</style>
<body>
    <header>
        <div>
        <h4 class="home">Home</h4>
        <h4>News</h4>
        <h4>Events</h4>
        <h4>Achievements</h4>
        <h4>About Us</h4>
    </div>
        <img class="userIcon" src="/project/src/icons/account_circle_24dp_1F1F1F_FILL0_wght400_GRAD0_opsz24.svg" alt="User.SVG">
        <h2 class="1">Spawn Point</h2>
        <h3 class="2">(minecraft)</h3>
    </header>
</body>
</html>
